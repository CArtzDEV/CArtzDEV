<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="code/style.css">
    <title>CArtz Hub</title>
  </head>

  <body>
    <div class="mv-showcase">
      <div class="mv-stage">
        <model-viewer
          id="portfolio-viewer"
          alt="3D Model Preview"
          autoplay
          auto-rotate
          camera-controls
          shadow-intensity="1"
          exposure="0.2"
          environment-image="neutral" 
          interaction-prompt="auto">
          <effect-composer render-mode="quality">
            <bloom-effect strength="0.3" radius="0.3" threshold="1.0"></bloom-effect>
            <color-grade-effect></color-grade-effect>
          </effect-composer>
        </model-viewer>
        <button class="mv-nav mv-prev" id="mv-prev-btn" aria-label="Previous model" disabled>❮</button>
        <button class="mv-nav mv-next" id="mv-next-btn" aria-label="Next model" disabled>❯</button>
        <div class="mv-anim-bar" id="mv-anim-bar" role="group" aria-label="Model animations"></div>
      </div>
      <div class="mv-bar">
        <div class="mv-info">
          <span class="mv-badge" id="mv-source">LOADING</span>
          <span class="mv-title" id="mv-title">Scanning repository...</span>
        </div>
        <div class="mv-counter" id="mv-counter">0 / 0</div>
      </div>
    </div>

    <footer class="mv-footer">© 2026 CArtz. All rights reserved</footer>
    
    <script type="module" src="code/import.js"></script>
    <script src="code/variables.js"></script> 
    <script src="code/buttons.js"></script> 
    <script src="code/render.js"></script>
    <script src="code/animations.js"></script> 
  </body>
</html>
